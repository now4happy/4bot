*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#faf9f4;color:#34404a}header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:20px}header small{color:#79837d;font-size:11px}main{padding:0 10px}.board{width:100%;height:calc(100dvh - 104px);min-height:470px;border:1px solid #e7e8df;border-radius:20px;background:radial-gradient(circle at center,#fffdf8,#f7f8f2);overflow:hidden;position:relative}svg{display:block;width:100%;height:100%;touch-action:manipulation}.link{fill:none;stroke-width:4;opacity:.55;stroke-linecap:round}.stem{stroke-width:2;opacity:.48}.item{cursor:pointer;outline:none}.item rect{fill:white;stroke-width:1.5}.item:hover rect,.item:focus rect{stroke-width:3;filter:drop-shadow(0 2px 5px #0002)}.item text{fill:#35424b;font-size:13px;font-weight:550;pointer-events:none}.group-title{font-size:19px;font-weight:750;fill:#263b43}.core-title{font-size:27px;font-weight:800;fill:#3c4b42}.core-sub{font-size:12px;fill:#778277}.bubble{position:absolute;z-index:5;width:min(360px,calc(100% - 24px));background:white;border:2px solid var(--accent,#a2c4b1);border-radius:22px;padding:17px 20px;box-shadow:0 12px 38px #35434d30;display:none;line-height:1.65;overflow-wrap:anywhere}.bubble.open{display:block}.bubble:after{content:'';position:absolute;bottom:-10px;left:30px;width:17px;height:17px;background:white;transform:rotate(45deg);border-right:2px solid var(--accent);border-bottom:2px solid var(--accent)}.bubble h2{margin:0 25px 7px 0;font-size:17px}.bubble p{margin:0;font-size:14px}.close{position:absolute;right:10px;top:9px;border:0;border-radius:50%;background:#f2f2ed;width:29px;height:29px;cursor:pointer;font-size:18px}footer{padding:7px 17px;font-size:11px;color:#77817b} @media(max-width:680px){header{padding:10px 13px}h1{font-size:17px}header small{font-size:10px}.board{height:calc(100dvh - 90px);min-height:450px}.bubble{padding:13px 15px}.bubble h2{font-size:15px}.bubble p{font-size:13px}}
</style></head><body><header><h1>✺ 생각의 연결 <small>전체 마인드맵 · v1.3 업데이트</small></h1><small>노드를 누르면 말풍선 설명 · 인터넷 없이 실행</small></header><main><div class="board" id="board"><svg id="map" viewBox="0 0 1440 920" preserveAspectRatio="xMidYMid meet" role="img" aria-label="생각의 연결 전체 마인드맵"></svg><div id="bubble" class="bubble" role="dialog" aria-label="항목 설명"><button class="close" id="close" aria-label="닫기">×</button><h2 id="bt"></h2><p id="bd"></p></div></div></main><footer>3파트와 5단계는 별도 구조 · 점선 테두리 = 미결/보류 · 승인 전 시안 · 모든 내용은 HTML 파일 내부에 포함 · v1.3: v3.3.5 staging, v2.4/v2.5, 용어 규칙 반영</footer><script>
const data=[{"name":"3파트 (작업 단위)","children":[{"name":"1파트 · 좋은질문","desc":"역질문으로 근본 질문(신호) 찾기 · 1단계","pending":false},{"name":"2파트 · 신호","desc":"신호와의 분리 + 신호의 전환 · 2~3단계","pending":false},{"name":"3파트 · 자유","desc":"습관개조 + 원하는 삶 · 4~5단계","pending":false},{"name":"좋은질문 원본 · 내면 명탐정 v2.4","desc":"좋은질문 파트 프롬프트·웹 설계 원본 · 정리 문서 있음","pending":false},{"name":"웹 시안 v2.5 · 파문","desc":"어두운 밤 장면 + 파동 효과 · AI 백엔드 없음 · 로컬 데모 · 최종 디자인 아님","pending":true}]},{"name":"5단계 (지도 순서)","children":[{"name":"1 · 좋은 질문","desc":"1파트 · 사용자가 질문을 발견·수정·확정","pending":false},{"name":"2 · 기존 신호","desc":"2파트 · 익숙한 신호를 알아차리고 분리","pending":false},{"name":"3 · 신호 전환","desc":"2파트 · 새로운 해석과 신호 전환반복","pending":false},{"name":"4 · 습관 개조","desc":"3파트 · 감정 조절·마인드 전환·행동 변화","pending":false},{"name":"5 · 원하는 삶 = 자유","desc":"3파트 · 스스로 선택하는 방향","pending":false}]},{"name":"버전 분리","children":[{"name":"일반 버전 · 현재 제작","desc":"중학생 이후 · 치유 · 자유도 높음","pending":false},{"name":"교육 버전","desc":"유아~중학생 · 질문 단순화 · 질문 파트 짧게 · 신호 트레이닝 길게 · 도덕적 흐름","pending":false},{"name":"최신 · v3.3.4 / v3.3.5","desc":"앱 v3.3.4 확정(한국어·영문) · 다국어 파문 v3.3.5 초안 staging 완료, main 아님","pending":false}]},{"name":"책 × 앱","children":[{"name":"콘텐츠 연결","desc":"같은 콘텐츠 ID · 책은 긴 생활 에세이 · 앱은 짧게","pending":false},{"name":"부분 통합","desc":"합본 원고 없음 · 에세이 원본 별개","pending":false},{"name":"대표 콘텐츠","desc":"술에 대한 믿음과 신호 전환 · TC-1-3-Q01 / TC-1-3-S01","pending":false},{"name":"안전 문구","desc":"의료·상담 서비스 아님 · 감정/갈망을 가짜로 규정하지 않음 · 의존·금단 시 갑작스런 금주 일반 권고 금지 · 의료기관 상담 · 응급 시 현지 번호 확인","pending":false},{"name":"용어 · 신호 전환반복","desc":"'자기 암시 쇄뇌' 대신 쓴다 · 쇄뇌의 부정적 의미 때문","pending":false}]},{"name":"메타보기 규칙","children":[{"name":"시작 50/100","desc":"100은 표시 범위이며 성장 상한 아님","pending":false},{"name":"좋은 질문 확정 +3","desc":"발견하고 사용자가 확정한 질문 1개당 +3","pending":false},{"name":"보상 제외","desc":"활동 횟수 · 출석 · 스트릭 · 랭킹으로 증가하지 않음","pending":false},{"name":"미결 · 자동 카운팅","desc":"확정 질문 자동 카운팅 아직 미연동","pending":true}]},{"name":"다국어","children":[{"name":"6개 언어","desc":"한국어 · 영어 · 스페인어 · 힌디어 · 중국어 · 일본어","pending":false},{"name":"언어 중립","desc":"3파트 · 5단계 · 콘텐츠 ID · 메타보기 규칙 동일","pending":false},{"name":"현지화","desc":"직역 아닌 일상 문체 · 사용자 메모 자동 번역 금지","pending":false},{"name":"미결 · 언어 승인","desc":"v3.3.5 초안 staging 완료 · 승인 대기 · 원어민 검토 대기","pending":true},{"name":"미결 · 명칭","desc":"다국어 appName · metaLabel 미확정","pending":true},{"name":"v3.3.5 · 파문 페이지","desc":"HTML 1개 + 카탈로그 6개 언어 · 각 65개 문구 · 키 일치 · HTML 내장 카탈로그","pending":false}]},{"name":"미결·보류","children":[{"name":"미결","desc":"다국어 명칭 · 원어민 검토 · 자동 카운팅 연동 · 영문 외 언어 승인","pending":true},{"name":"보류 · 결정 요청","desc":"특정 명상 프로그램 추천","pending":true},{"name":"보류 · 결정 요청","desc":"어린 시절 베스트 컨디션의 과학 주장 여부","pending":true},{"name":"보류 · 결정 요청","desc":"술 개인사 상세 수준","pending":true},{"name":"보류 · 결정 요청","desc":"1일 1식 포함 수준","pending":true}]}];
const svg=document.getElementById('map'),board=document.getElementById('board'),bubble=document.getElementById('bubble');const NS='http://www.w3.org/2000/svg';
const groups=[{x:40,y:45,w:390,c:'#e6a38c',bg:'#fbe9e1',anchor:[625,410]},{x:525,y:35,w:390,c:'#91b6a4',bg:'#e9f3eb',anchor:[720,390]},{x:1010,y:45,w:390,c:'#a89ed5',bg:'#f0ecfa',anchor:[815,410]},{x:1020,y:535,w:380,c:'#e6ba70',bg:'#fff2d9',anchor:[830,530]},{x:560,y:625,w:380,c:'#88b5d0',bg:'#e8f2f9',anchor:[735,555]},{x:40,y:560,w:390,c:'#a3bf79',bg:'#eff6e1',anchor:[615,530]},{x:40,y:300,w:370,c:'#d49cb3',bg:'#f9e8f0',anchor:[610,470]}];
function el(tag,attrs={},parent=svg){let e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}
function txt(x,y,t,attrs={},parent=svg){let e=el('text',{x,y,...attrs},parent);e.textContent=t;return e}
function show(n,c,target){document.getElementById('bt').textContent=n.name;document.getElementById('bd').textContent=n.desc;bubble.style.setProperty('--accent',c);bubble.classList.add('open');const r=target.getBoundingClientRect(),b=board.getBoundingClientRect();const bw=Math.min(360,b.width-24);let left=Math.min(Math.max(12,r.left-b.left+r.width/2-bw/2),b.width-bw-12);let top=r.top-b.top-175;if(top<12)top=Math.min(b.height-180,r.bottom-b.top+12);bubble.style.left=left+'px';bubble.style.top=Math.max(12,top)+'px'}
// Gentle curved stems link each topic to the center.
groups.forEach((g,i)=>{const tx=g.x+g.w/2,ty=g.y+25;el('path',{d:`M ${g.anchor[0]} ${g.anchor[1]} Q ${(g.anchor[0]+tx)/2} ${(g.anchor[1]+ty)/2-35} ${tx} ${ty}`,class:'link',stroke:g.c})});
el('ellipse',{cx:720,cy:470,rx:122,ry:76,fill:'#fff0ca',stroke:'#e5bc70','stroke-width':3});txt(720,467,'생각의 연결',{'text-anchor':'middle',class:'core-title'});txt(720,491,'좋은 질문에서 자유로',{'text-anchor':'middle',class:'core-sub'});
groups.forEach((g,i)=>{let b=data[i],n=b.children.length,header=el('g',{},svg);el('rect',{x:g.x,y:g.y,width:g.w,height:47,rx:23,fill:g.bg,stroke:g.c,'stroke-width':2},header);txt(g.x+18,g.y+30,(i+1)+'. '+b.name,{class:'group-title'},header);let step=39; b.children.forEach((node,j)=>{let y=g.y+58+j*step;let grp=el('g',{class:'item',tabindex:0,role:'button','aria-label':node.name},svg);let label=node.name;const max=27;if(label.length>max)label=label.slice(0,max-1)+'…';el('rect',{x:g.x+12,y,width:g.w-24,height:32,rx:13,stroke:g.c,'stroke-dasharray':node.pending?'5 4':'none',fill:node.pending?'#fff9ed':'#fff'},grp);txt(g.x+24,y+21,(node.pending?'◇ ':'• ')+label,{},grp);grp.addEventListener('click',e=>{e.stopPropagation();show(node,g.c,grp)});grp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(node,g.c,grp)}})})});
document.getElementById('close').onclick=()=>bubble.classList.remove('open');board.addEventListener('click',e=>{if(!e.target.closest('.bubble')&&!e.target.closest('.item'))bubble.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')bubble.classList.remove('open')});
</script></body></html>
