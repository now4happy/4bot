<!doctype html>
<!-- 사무실 스나이퍼 매매 그림 (계단식 v9 · 한 화면 승인 시안) · 보기 전용 · 데이터: /api/sniper-picture (로그인 필요) · 주문·승인·설정 기능 없음 -->
<!-- 설계: 비율·척도 무시, 위층일수록 오른쪽에서 시작, 바 길이 = 주수(1주=1칸), 전체가 틀을 넘으면 전체를 같은 비율로 축소, 주수는 층 옆, 칸 안 흰색, 상단 2열, 층별 중복 잔글씨 제거(상태는 목표 가격 옆 기호로), 바 세로 16px -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스나이퍼 매매 그림</title>
<style>
:root{--bg:#f4f3ee;--card:#fffefa;--ink:#1f3530;--muted:#76827c;--line:#dfe0d6;--accent:#2b5446;--ok:#2f8a57;--warn:#c98a1a;--bad:#c4473a;--chip:#eceee4;
  --c-l1:#1f7a6b;--c-ind:#c98a1a;--c-up:#4d6f93;--c-wma:#7255b8}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1c2320;--ink:#e6ece8;--muted:#93a29a;--line:#2c3631;--accent:#8fc9ad;--ok:#5cc28a;--warn:#e3b04f;--bad:#ef7a6c;--chip:#25302b;
  --c-l1:#4cc2ad;--c-ind:#e3b04f;--c-up:#86a9cf;--c-wma:#b49cf0}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:16px;margin:0;letter-spacing:-.4px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}.tools a,.tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px;text-decoration:none;white-space:nowrap}
main{max-width:520px;margin:0 auto;padding:6px 12px 8px}
.status{font-size:13px;color:var(--muted);margin:2px 2px 8px;overflow-wrap:anywhere}.status b{color:var(--ink)}
.err{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:6px}
.profit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.profit .big{font-size:20px;font-weight:700;letter-spacing:-.4px}.profit .sm{font-size:12.5px;color:var(--muted)}
.top2{display:flex;gap:12px}.top2 .col{flex:1;min-width:0}.top2 .col+.col{border-left:1px solid var(--line);padding-left:12px}
.top2 .big{font-size:24px;font-weight:700;letter-spacing:-.4px}.top2 .sm{font-size:12px;color:var(--muted)}.top2 .line{font-size:13px;margin-top:2px}
.gray{color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:2px 2px 8px}
.lrow{display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--line);padding:3px 0}.lrow:first-of-type{border-top:0}
.lrow.dim{opacity:.72}
.tiercol{width:78px;flex:none;padding-top:0}
.tier{font-size:13px;font-weight:700}
.tierqty{font-size:12.5px;color:var(--muted)}
.barwrap{flex:1;min-width:0}
.bar{display:flex;height:16px;border:2px solid #1f3530;border-radius:6px;overflow:hidden;background:#fff}
.cell{flex:none;background:#fff;border-right:1px solid #1f3530}
.cell:last-child{border-right:0}
.prices{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:0}
.lp{font-size:11.5px;color:var(--muted);margin:1px 2px 0;overflow-wrap:anywhere}
.lp.ok{color:var(--ok);font-weight:650}.lp.lk{color:var(--warn)}
.hold{font-size:13.5px;margin:8px 2px 0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0;overflow-wrap:anywhere}
.flag{font-size:12.5px;margin:2px 2px 8px;padding:5px 9px;border-radius:9px;background:var(--chip)}
.empty{text-align:center;padding:26px 0;font-size:14px}.empty small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
</style></head><body>
<header><h1>📈 스나이퍼 매매 그림</h1>
  <div class="tools"><a href="/board">상황판</a><button id="reload" type="button">새로고침</button></div></header>
<main>
  <div class="status" id="status">불러오는 중…</div>
  <div class="flag" id="flag" hidden></div>
  <div class="card"><div class="top2" id="top2"></div></div>
  <div class="card">
    <div class="legend"><span>바 길이 = 주수 · 위층일수록 오른쪽 시작</span><span>● 산 가격</span><span>▶ 1층 목표 +1.5%</span><span>◆ 개별 목표 +1.0%</span><span>■ 통합이평 +1.0%</span><span>✓ 도달 · 🔒 잠김</span></div>
    <div id="pic" aria-label="층별 가격 그림"></div>
    <div id="wma" aria-label="통합이평"></div>
  </div>
  <p class="note" id="notes"></p>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function usd(v){return '$'+Number(v).toFixed(2)}
  function sg(v){return (v>=0?'+':'-')+'$'+Math.abs(v).toFixed(2)}
  function cls(v){return v>=0?'pos':'neg'}
  var ERR={ledger_not_found:'스나이퍼 원장을 찾지 못했어요 (스나이퍼 폴더 위치 확인 필요)',ledger_unreadable:'원장을 읽지 못했어요 (읽기 권한 또는 파일 형식 확인 필요)',engine_unavailable:'계산 모듈(quant_engine)을 읽지 못했어요',picture_failed:'그림 데이터를 만들지 못했어요'};

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  var COL={l1:'var(--c-l1)',up:'var(--c-up)',indiv:'var(--c-ind)',wma:'var(--c-wma)'};
  var lastData=null,resizeTimer=null;

  function statusText(tgt,locked,unlock,reached,lp){
    if(!lp)return '목표 '+usd(tgt);
    if(locked)return '🔒 '+(unlock||'04:07')+' 해금'+(reached?' · 도달':'');
    if(reached)return '✓ 목표 도달';
    return '목표까지 +'+((tgt/lp-1)*100).toFixed(1)+'%'
  }
  function statusCls(locked,reached,lp){
    if(!lp)return '';
    if(locked)return 'lk';
    if(reached)return 'ok';
    return ''
  }

  function draw(d){
    var box=$('pic');box.textContent='';$('wma').textContent='';
    var T=(d.tiers||[]).slice().sort(function(a,b){return b.tier-a.tier}),G=d.targets||[],lp=d.price&&d.price.live;
    if(!T.length){var em=el('div','empty','보유 지층 없음 · 0주');em.appendChild(el('small',null,'60초 타임쉴드 확인 뒤 1층 산입 대기'));if(lp)em.appendChild(el('small',null,'현재가 '+usd(lp)));box.appendChild(em);return}
    // 계단식: 위층일수록 오른쪽에서 시작, 바 길이 = 주수. 전체가 틀을 넘으면 전체를 같은 비율로 축소
    var picW=box.clientWidth||400,avail=Math.max(180,picW-70);
    var cellBase=22,stepBase=24,maxEnd=0;
    T.forEach(function(t){var end=(t.tier-1)*stepBase+t.qty*cellBase;if(end>maxEnd)maxEnd=end});
    var scale=maxEnd>avail?avail/maxEnd:1,cell=cellBase*scale,step=stepBase*scale;
    T.forEach(function(t){
      var tg=null;G.forEach(function(g){if((g.kind==='l1'||g.kind==='indiv')&&g.tiers.indexOf(t.tier)>=0)tg=g});
      var locked=!!(tg&&tg.locked);
      var flagSym=locked?' 🔒':(t.reached?' ✓':'');
      var col=COL[t.kind==='l1'?'l1':'up'];
      var row=el('div','lrow'+(locked?' dim':''));
      var tc=el('div','tiercol');tc.appendChild(el('div','tier',t.tier+'층 '+t.qty+'주'+(t.lot_count>1?' ('+t.lot_count+'회)':'')));row.appendChild(tc);
      var wrap=el('div','barwrap'),off=(t.tier-1)*step,barW=t.qty*cell;
      var bar=el('div','bar');bar.style.marginLeft=off+'px';bar.style.width=barW+'px';bar.style.borderColor=col;
      for(var i=0;i<t.qty;i++){var c=el('div','cell');c.style.width=cell+'px';bar.appendChild(c)}
      wrap.appendChild(bar);
      var pr=el('div','prices');pr.style.marginLeft=off+'px';pr.style.width=barW+'px';
      pr.appendChild(el('span',null,usd(t.price)));pr.appendChild(el('span',null,usd(t.target)+flagSym));wrap.appendChild(pr);
      row.appendChild(wrap);box.appendChild(row);
    });
    // 1층이 없으면 맨 아래에 없음 행 (계단 최하단)
    var hasL1=false;T.forEach(function(t){if(t.tier===1)hasL1=true});
    if(!hasL1){
      var row2=el('div','lrow dim'),tc2=el('div','tiercol');
      tc2.appendChild(el('div','tier','1층'));tc2.appendChild(el('div','tierqty','없음'));row2.appendChild(tc2);
      var wrap2=el('div','barwrap');wrap2.appendChild(el('div','lp','없음 · 재장전 대기 · 밤·주말에는 매수 잠금'));row2.appendChild(wrap2);box.appendChild(row2);
    }
    G.forEach(function(g){if(g.kind!=='wma')return;
      var st=statusText(g.price,false,'',g.reached,lp),sc=statusCls(false,g.reached,lp),nt=g.tiers.length,qty=0;
      T.forEach(function(t){if(g.tiers.indexOf(t.tier)>=0)qty+=t.qty});
      var lockNote=(d.session&&d.session.overnight&&T.length&&T[T.length-1].kind==='l1')?' · 1층이 본전 넘으면 졸업':'';
      var wrow=el('div','lrow'),wtc=el('div','tiercol');
      wtc.appendChild(el('div','tier','통합이평'));wtc.appendChild(el('div','tierqty',g.tiers[0]+'~'+g.tiers[nt-1]+'층 '+qty+'주'));wrow.appendChild(wtc);
      var wwrap=el('div','barwrap');
      wwrap.appendChild(el('div','lp'+(sc?' '+sc:''),'평단 '+usd(g.avg_price||g.price)+' → 목표 '+usd(g.price)+' (+'+g.pct.toFixed(1)+'%) · '+st+lockNote));
      wrow.appendChild(wwrap);$('wma').appendChild(wrow);
    });
  }

  function render(d){
    lastData=d;
    var st=$('status'),fl=$('flag');
    if(!d.ok){st.className='status err';st.textContent=ERR[d.error]||('불러오기 실패: '+(d.error||'?'));fl.hidden=true;$('pic').textContent='';$('wma').textContent='';$('top2').textContent='';$('notes').textContent='';return}
    var lp=d.price.live;
    st.className='status';st.textContent='';
    var b=document.createElement('b');b.textContent='SOXL · '+d.session.name+' ('+d.session.hm+' ET)';st.appendChild(b);
    st.appendChild(document.createTextNode(' · '+(lp?'현재가 '+usd(lp):'현재가 미확인')+' · 확인 '+d.observed_kst.slice(5,16)+' KST'+(d.ledger?' · 원장 '+d.ledger.updated_kst.slice(6,11):'')));
    var msgs=[];
    if(!d.is_active)msgs.push('⏸ 스나이퍼 가동 OFF');
    if(d.session.weekend_closed)msgs.push('🛑 주말휴장');
    if(d.engine){if(d.engine.should_sell)msgs.push('⚡ 지금 매도 조건 충족: '+d.engine.sell_tiers.join('·')+'층');
      else if(d.engine.overnight_indiv_locked)msgs.push('🔒 밤 시간 · 개별 매도 잠김 (통합이평 졸업만 가능)')}
    if(!lp)msgs.push('현재가를 알 수 없어 수익률은 —, 미실현은 현재가 미확인으로 표시돼요');
    fl.hidden=!msgs.length;fl.textContent=msgs.join(' · ');
    var r=d.realized,h=d.holding,T2=$('top2');T2.textContent='';
    var left=el('div','col');
    left.appendChild(el('div','sm','판 이익 · 누적 실현(세후)'));
    left.appendChild(el('div','big '+cls(r.cumulative_net_usd),sg(r.cumulative_net_usd)));
    left.appendChild(el('div','line','매도 '+r.sell_events+'회 (이익 '+r.win_events+')'));
    left.appendChild(el('div','line','매도한 주식 '+r.sold_shares+'주'));
    var right=el('div','col');
    right.appendChild(el('div','sm','지금 보유 · 수익률'));
    if(h.shares>0&&h.unrealized_pct!=null){
      right.appendChild(el('div','big '+cls(h.unrealized_pct),((h.unrealized_pct>=0?'+':'')+h.unrealized_pct.toFixed(2)+'%')));
      right.appendChild(el('div','line','보유 '+h.shares+'주 · 평단 '+usd(h.avg_price)));
      right.appendChild(el('div','line','투자금 '+usd(h.shares*h.avg_price)+' · 미실현 '+sg(h.unrealized_usd)));
    } else if(h.shares>0){
      right.appendChild(el('div','big gray','—'));
      right.appendChild(el('div','line','보유 '+h.shares+'주 · 평단 '+usd(h.avg_price)));
      var inv=el('div','line','투자금 '+usd(h.shares*h.avg_price)+' · ');inv.appendChild(el('span','gray','현재가 미확인'));right.appendChild(inv);
    } else {
      right.appendChild(el('div','big gray','—'));
      right.appendChild(el('div','line','보유 없음'));
    }
    T2.appendChild(left);T2.appendChild(right);
    draw(d);
    var n=[];n.push('달러($) 기준 · '+d.fx.note+'.');
    n.push('비율·척도 무시: 위층일수록 오른쪽에서 시작하고, 바 길이는 주수예요. 층 옆 숫자가 보유 주수, 바 아래 왼쪽이 매수, 오른쪽이 매도(목표) 가격이에요. 전체가 틀을 넘으면 전체를 같은 비율로 줄여요.');
    if(!r.history_available)n.push('개별 과거 매도(언제·어느 층·얼마에)는 원장에 목록이 없어 표시하지 않아요. 누적 실현 이익만 보여 줘요.');
    $('notes').textContent=n.join(' ');
  }
  function load(){
    return fetch('/api/sniper-picture',{credentials:'same-origin',cache:'no-store'}).then(function(r){
      if(r.status===401){location.href='/login';return null}
      if(!r.ok)throw new Error('HTTP '+r.status);return r.json()
    }).then(function(d){if(d)render(d)}).catch(function(e){var s=$('status');s.className='status err';s.textContent='불러오기 실패: '+e.message+' · 새로고침을 눌러 보세요'});
  }
  $('reload').addEventListener('click',load);
  window.addEventListener('resize',function(){if(resizeTimer)clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){if(lastData&&lastData.ok)draw(lastData)},200)});
  load();setInterval(load,30000);
})();
</script>
</body></html>
