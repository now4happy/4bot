<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOT OFFICE · 로그인</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff2e9;color:#254232;font:14px system-ui}main{background:#fff;border:1px solid #dce4d8;border-top:6px solid #245c43;border-radius:10px;width:min(420px,92vw);padding:40px}small{letter-spacing:3px;color:#9d8555}h1{font-size:28px}p{color:#7b8878;line-height:1.8}label{display:block;margin:20px 0 8px}input,button{width:100%;padding:13px;font:inherit;border:1px solid #dce4d8;border-radius:5px}button{background:#245c43;color:white;margin-top:24px;cursor:pointer}#message{color:#a25339}footer{font-size:11px;margin-top:25px;color:#7b8878}</style><main><small>PRIVATE WORKSPACE</small><h1>BOT OFFICE</h1><p>서버에 설정한 아이디와 비밀번호로<br>운영 사무실에 입장하세요.</p><form><label for="u">아이디</label><input id="u" autocomplete="username" required maxlength="80"><label for="p">비밀번호</label><input id="p" type="password" autocomplete="current-password" required maxlength="1024"><button>로그인 →</button><p id="message" role="alert"></p></form><footer>조회 전용 · 실시간 서비스 상태 / 주문 체결 확인 제외</footer></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#u').value,password:document.querySelector('#p').value})});if(r.ok){location.replace('/');return}const d=await r.json();document.querySelector('#message').textContent=d.error==='try_later'?'시도가 많습니다. 5분 후 다시 시도하세요.':d.error==='https_required'?'HTTPS 연결이 필요합니다.':'아이디 또는 비밀번호를 확인하세요.'}catch{document.querySelector('#message').textContent='서버에 연결할 수 없습니다.'}b.disabled=false}</script></html>
